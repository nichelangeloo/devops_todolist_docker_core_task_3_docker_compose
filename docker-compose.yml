networks:
    hw-db-net:
        driver: bridge
services:
    todoapp:
        image: todoapp:3.0
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8000"
        environment:
            - DB_HOST=mysql-local
            - DB_NAME=app_db
            - DB_USER=app_user
            - DB_PASSWORD=1234
        networks:
            - hw-db-net
        depends_on:
            - mysql-local
        restart: unless-stopped
    mysql-local:
        image: mysql:1.0
        build:
            context: .
            dockerfile: Dockerfile.mysql
        container_name: mysql
        ports:
            - "3036:3036"
        volumes:
            - hw-db:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=1234
            - MYSQL_DATABASE=app_db
            - MYSQL_USER=app_user
            - MYSQL_PASSWORD=1234
        networks:
            - hw-db-net
volumes:
    hw-db:
